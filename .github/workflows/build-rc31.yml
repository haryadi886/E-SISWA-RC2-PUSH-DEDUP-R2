name: Build SSD-SMPN4D Android RC.3.1 (WEB R49)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/rc3.1-r23-web-r49
    paths:
      - ".github/workflows/build-rc31.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout RC.3.1 build branch
        uses: actions/checkout@v4
        with:
          ref: feature/rc3.1-r23-web-r49
          fetch-depth: 1

      - name: Diagnose and reassemble RC.3.1 source archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(source/rc31-source.b64.part-*)
          expected=(
            114f895b06653f4c42e0d900826041b75a26224d85328e2dd63b841e1e96ad09
            e977b4b7e1e9215f531533a43ebbd57456aa9d8373b8189300b98c88d50cfe7d
            ca2c63cf1c9292d6088bb8edecd2a36d6b37f7fbca0678c078b0676f53fd666e
            2f54a025fb958026f1c7b2144a218d0a616ffa7fbbe0dee79fa32a52230e966c
            95a18af5ae333e184acfd2b3d74fa86cdb767ba79fc609f51596b5fdd24c6ea6
            a1b350f96873c3e8b0893e6ae05bb3b491d2a906af7988f7bfe32655019dbac3
            f547f47166c92fd6c0863f5b9c5c475f6b1c9cf7441a61e757e03bfebb05ab02
            c5b9aed4a74a2633036c306aad1990a1cd7ee4fb96c3f31e0c7613348f955f55
            b7f34ce12608bbd5f2c8adfa4f55ca454a28417dcb290139745c05c89bfb5508
            4e66303343a122c5be400ef8fc7b4bccac115fe29b10517bd548d48f29e0b6d5
            b87b2bb4f63d4bd5825e31ec431f6d54e62c866488cbf01c4bf929e40302017f
            f93f666d77cbed07df07b1468095d49b1a8d8998ee0e6d010221307d68a6efad
          )
          if [ "${#parts[@]}" -ne 12 ]; then
            echo "Expected 12 source shards; found ${#parts[@]}"
            exit 1
          fi
          bad=0
          for i in "${!parts[@]}"; do
            actual="$(sha256sum "${parts[$i]}" | cut -d' ' -f1)"
            printf 'PART %02d expected=%s actual=%s\n' "$((i+1))" "${expected[$i]}" "$actual"
            if [ "$actual" != "${expected[$i]}" ]; then bad=1; fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "One or more source shards differ from the prepared local source archive."
            exit 21
          fi
          cat "${parts[@]}" > /tmp/rc31-source.b64
          base64 --decode /tmp/rc31-source.b64 > /tmp/rc31-source.zip
          echo "8f07680d3397bfc908883731af6acbe91c303bfe35d7c470add8473f2a38df2e  /tmp/rc31-source.zip" | sha256sum --check -
          unzip -t /tmp/rc31-source.zip
          mkdir -p project
          unzip -q /tmp/rc31-source.zip -d project
          test -f project/app/build.gradle
          test -f project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -q "versionCode 32" project/app/build.gradle
          grep -q "versionName 'RC.3.1'" project/app/build.gradle
          grep -q "AKfycbyBy0SGP9IBl_lm1-7AICQoCP3kFZGdKsShYCcVoxRC_9thKJ88H9U9Q-qJ8c0nj74ExQ" project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Android source contract
        working-directory: project
        run: python3 tools/verify_project.py

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK metadata and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/rc31-apk-badging.txt
          grep -q "versionCode='32' versionName='RC.3.1'" /tmp/rc31-apk-badging.txt
          grep -q "package: name='id.sch.smpn4dumai.esiswa'" /tmp/rc31-apk-badging.txt
          sha256sum "$APK" | tee project/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload RC.3.1 test APK
        uses: actions/upload-artifact@v4
        with:
          name: SSD-SMPN4D-RC.3.1-R23-APK-UJI
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
