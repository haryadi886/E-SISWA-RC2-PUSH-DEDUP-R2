name: Build SSD-SMPN4D Android RC.3.1 (WEB R49)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/rc3.1-r23-web-r49
    paths:
      - ".github/workflows/build-rc31.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout RC.3.1 build branch
        uses: actions/checkout@v4
        with:
          ref: feature/rc3.1-r23-web-r49
          fetch-depth: 1

      - name: Reassemble and verify RC.3.1 source archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(source/rc31-source.b64.part-*)
          if [ "${#parts[@]}" -ne 12 ]; then
            echo "Expected 12 source shards; found ${#parts[@]}"
            exit 1
          fi
          cat "${parts[@]}" > /tmp/rc31-source.b64
          base64 --decode /tmp/rc31-source.b64 > /tmp/rc31-source.zip
          echo "8f07680d3397bfc908883731af6acbe91c303bfe35d7c470add8473f2a38df2e  /tmp/rc31-source.zip" | sha256sum --check -
          unzip -t /tmp/rc31-source.zip
          mkdir -p project
          unzip -q /tmp/rc31-source.zip -d project
          test -f project/app/build.gradle
          test -f project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -q "versionCode 32" project/app/build.gradle
          grep -q "versionName 'RC.3.1'" project/app/build.gradle
          grep -q "AKfycbyBy0SGP9IBl_lm1-7AICQoCP3kFZGdKsShYCcVoxRC_9thKJ88H9U9Q-qJ8c0nj74ExQ" project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Android source contract
        working-directory: project
        run: python3 tools/verify_project.py

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK metadata and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/rc31-apk-badging.txt
          grep -q "versionCode='32' versionName='RC.3.1'" /tmp/rc31-apk-badging.txt
          grep -q "package: name='id.sch.smpn4dumai.esiswa'" /tmp/rc31-apk-badging.txt
          sha256sum "$APK" | tee project/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload RC.3.1 test APK
        uses: actions/upload-artifact@v4
        with:
          name: SSD-SMPN4D-RC.3.1-R23-APK-UJI
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
