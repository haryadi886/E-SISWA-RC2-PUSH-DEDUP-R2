name: Build RC.2 Push Dedup R2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover uploaded RC.2 source archive
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="352feb036e3af5c596e3f948ddf3c27d78b1093f"
          SOURCE_ZIP="E-SISWA-R7-RC2-PUSH-DEDUP-R2-FULL-SOURCE.zip"
          git show "${SOURCE_COMMIT}:${SOURCE_ZIP}" > /tmp/esiswa-rc2-source.zip
          mkdir -p project
          unzip -t /tmp/esiswa-rc2-source.zip
          unzip -q /tmp/esiswa-rc2-source.zip -d project
          test -f project/app/build.gradle
          test -f project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java
          grep -q "versionCode 29" project/app/build.gradle
          grep -q "versionName 'RC.2'" project/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK and report checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee project/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-RC2-PUSH-DEDUP-R2-APK
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
